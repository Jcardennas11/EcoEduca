<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - EcoEduca</title>
    <link rel="shortcut icon" href="../images/guarde-ilustracion-concepto-planeta-hombre-mujer_23-2148509643.avif" type="image/x-icon">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/firebase.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-background"></div>
        
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <h2 class="auth_title">EcoEduca</h2>
                </div>
                <h1 class="auth-title">Crear Cuenta</h1>
                <p class="auth-subtitle">Únete a nuestra comunidad educativa ambiental</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-input" placeholder="Tu nombre" required>
                        <span class="form-error" id="nombreError"></span>
                    </div>

                    <div class="form-group">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" id="apellido" name="apellido" class="form-input" placeholder="Tu apellido" required>
                        <span class="form-error" id="apellidoError"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com" required>
                    <span class="form-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="telefono" class="form-label">Teléfono (opcional)</label>
                    <input type="tel" id="telefono" name="telefono" class="form-input" placeholder="+57 300 000 0000">
                    <span class="form-error" id="telefonoError"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" class="form-input" placeholder="Mínimo 8 caracteres" required>
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <img src="../icons/eye.svg" alt="Mostrar contraseña" class="password-icon">
                        </button>
                    </div>
                    <span class="form-error" id="passwordError"></span>
                    <div class="password-strength" id="passwordStrength"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                    <div class="password-input-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Repite tu contraseña" required>
                        <button type="button" class="password-toggle" id="confirmPasswordToggle">
                            <img src="../icons/eye.svg" alt="Mostrar contraseña" class="password-icon">
                        </button>
                    </div>
                    <span class="form-error" id="confirmPasswordError"></span>
                </div>

                <div class="form-group">
                    <label class="checkbox-container">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span class="checkmark"></span>
                        Acepto los <a href="#" class="auth-link">términos y condiciones</a> y la <a href="#" class="auth-link">política de privacidad</a>
                    </label>
                    <span class="form-error" id="termsError"></span>
                </div>

                <button type="submit" class="auth-btn" id="registerBtn">Crear Cuenta</button>

                <div class="auth-divider">
                    <span>o</span>
                </div>

                <div class="social-login">
                    <button type="button" class="social-btn google-btn">
                        <img src="../icons/google.svg" alt="Google" class="social-icon">
                        Registrarse con Google
                    </button>
                </div>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html" class="auth-link">Inicia sesión</a></p>
            </div>
        </div>

        <div class="auth-back">
            <a href="../index.html" class="back-link">
                <img src="../icons/leftarrow.svg" alt="Volver" class="back-icon">
                Volver al inicio
            </a>
        </div>
    </div>

    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/firebase-auth.js"></script>
</body>
</html>
