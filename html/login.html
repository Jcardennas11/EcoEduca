<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoEduca</title>
    <link rel="shortcut icon" href="../images/guarde-ilustracion-concepto-planeta-hombre-mujer_23-2148509643.avif" type="image/x-icon">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/firebase.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-background"></div>
        
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <h2 class="auth_title">EcoEduca</h2>
                </div>
                <h1 class="auth-title">Iniciar Sesión</h1>
                <p class="auth-subtitle">Accede a tu cuenta para continuar aprendiendo</p>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com" required>
                    <span class="form-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <img src="../icons/eye.svg" alt="Mostrar contraseña" class="password-icon">
                        </button>
                    </div>
                    <span class="form-error" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkmark"></span>
                        Recordarme
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="auth-btn" id="loginBtn">Iniciar Sesión</button>

                <div class="auth-divider">
                    <span>o</span>
                </div>

                <div class="social-login">
                    <button type="button" class="social-btn google-btn">
                        <img src="../icons/google.svg" alt="Google" class="social-icon">
                        Continuar con Google
                    </button>
                </div>
            </form>

            <div class="auth-footer">
                <p>¿No tienes una cuenta? <a href="registro.html" class="auth-link">Regístrate</a></p>
            </div>
        </div>

        <div class="auth-back">
            <a href="../index.html" class="back-link">
                <img src="../icons/leftarrow.svg" alt="Volver" class="back-icon">
                Volver al inicio
            </a>
        </div>
    </div>

    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/firebase-auth.js"></script>
</body>
</html>
